name: ticket-orchestrator

services:
  app:
    build: ./bot
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      API_KEY: ${API_KEY:?Configure API_KEY no arquivo .env}
      DASHBOARD_DIR: /dashboard
      JOB_DELAY_SECONDS: ${JOB_DELAY_SECONDS:-1}
    volumes:
      - ./dashboard:/dashboard:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  gateway:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_SITE_ADDRESS: ":80"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configure ADMIN_PASSWORD_HASH no arquivo .env}
      API_KEY: ${API_KEY:?Configure API_KEY no arquivo .env}
    ports:
      # Seguro para VPS com outros sites: acessível somente pelo próprio servidor.
      - "127.0.0.1:${APP_PORT:-8182}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge
